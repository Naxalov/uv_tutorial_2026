name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: uv run --with pytest pytest -v -rxXs --junitxml=results.xml

      - name: Test summary
        if: always()
        uses: pmeier/pytest-results-action@v0.7.1
        with:
          path: results.xml
          summary: true
          display-options: fEXs
          fail-on-empty: true
          title: Ledger test results
